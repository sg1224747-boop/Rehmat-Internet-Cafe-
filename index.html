<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rehmat Internet Cafe - Digital Service Center</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* ============================================
           REHMAT INTERNET CAFE - COMPLETE WEBSITE
           ============================================ */
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #00D9FF;
            --secondary: #FF6B6B;
            --dark: #0f0f1a;
            --light: #ffffff;
            --gray: #cccccc;
            --gradient: linear-gradient(135deg, #00D9FF 0%, #FF6B6B 100%);
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: var(--dark);
            color: var(--light);
            font-family: 'Segoe UI', Arial, sans-serif;
            line-height: 1.6;
            overflow-x: hidden;
        }

        a { text-decoration: none; color: inherit; }
        ul { list-style: none; }

        /* ============================================
           ANIMATED BACKGROUND
           ============================================ */
        
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 100%);
        }

        .bg-glow {
            position: fixed;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.4;
            animation: glowMove 8s infinite alternate;
        }

        .bg-glow-1 {
            top: -200px;
            left: -200px;
            background: var(--primary);
        }

        .bg-glow-2 {
            bottom: -200px;
            right: -200px;
            background: var(--secondary);
            animation-delay: -4s;
        }

        @keyframes glowMove {
            0% { transform: translate(0, 0); }
            100% { transform: translate(100px, 50px); }
        }

        /* Floating Shapes */
        .floating-shapes {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }

        .shape {
            position: absolute;
            border: 2px solid rgba(0, 217, 255, 0.2);
            border-radius: 50%;
            animation: floatShape 20s infinite linear;
        }

        .shape-1 { width: 100px; height: 100px; top: 20%; left: 10%; }
        .shape-2 { width: 150px; height: 150px; top: 60%; right: 15%; animation-duration: 25s; border-color: rgba(255, 107, 107, 0.2); }
        .shape-3 { width: 80px; height: 80px; bottom: 30%; left: 20%; animation-duration: 15s; }

        @keyframes floatShape {
            0% { transform: rotate(0deg) translateY(0); }
            50% { transform: rotate(180deg) translateY(-30px); }
            100% { transform: rotate(360deg) translateY(0); }
        }

        /* ============================================
           NAVIGATION
           ============================================ */
        
        nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            background: rgba(15, 15, 26, 0.9);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            animation: slideDown 0.6s ease-out;
        }

        @keyframes slideDown {
            from { transform: translateY(-100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .logo {
            font-size: 20px;
            font-weight: 700;
            color: var(--light);
        }

        .logo span {
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .nav-links {
            display: flex;
            gap: 30px;
        }

        .nav-links a {
            color: var(--gray);
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s;
            position: relative;
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--gradient);
            transition: width 0.3s;
        }

        .nav-links a:hover {
            color: var(--light);
        }

        .nav-links a:hover::after {
            width: 100%;
        }

        /* ============================================
           HERO SECTION
           ============================================ */
        
        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 120px 20px 80px;
            position: relative;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(0, 217, 255, 0.2) 0%, transparent 70%);
            animation: heroPulse 4s infinite;
        }

        @keyframes heroPulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
            50% { transform: translate(-50%, -50%) scale(1.3); opacity: 0.2; }
        }

        .hero-content {
            max-width: 800px;
            position: relative;
            z-index: 1;
            animation: fadeInUp 1s ease-out;
        }

        @keyframes fadeInUp {
            from { transform: translateY(50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .hero-badge {
            display: inline-block;
            padding: 8px 20px;
            background: rgba(0, 217, 255, 0.1);
            border: 1px solid rgba(0, 217, 255, 0.3);
            border-radius: 30px;
            font-size: 13px;
            color: var(--primary);
            margin-bottom: 25px;
        }

        .hero h1 {
            font-size: 55px;
            font-weight: 800;
            line-height: 1.15;
            margin-bottom: 20px;
        }

        .hero h1 span {
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .hero p {
            font-size: 16px;
            color: var(--gray);
            margin-bottom: 35px;
            max-width: 550px;
            margin-left: auto;
            margin-right: auto;
        }

        .hero-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 14px 35px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
            cursor: pointer;
            display: inline-block;
        }

        .btn-primary {
            background: var(--gradient);
            color: #000;
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(0, 217, 255, 0.3);
        }

        .btn-secondary {
            background: transparent;
            color: var(--light);
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        .btn-secondary:hover {
            border-color: var(--primary);
            background: rgba(0, 217, 255, 0.1);
        }

        /* ============================================
           SERVICES SECTION
           ============================================ */
        
        .services {
            padding: 100px 20px;
        }

        .section-title {
            text-align: center;
            margin-bottom: 60px;
        }

        .section-title h2 {
            font-size: 40px;
            font-weight: 700;
            margin-bottom: 15px;
        }

        .section-title p {
            color: var(--gray);
            font-size: 15px;
        }

        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .service-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 35px;
            transition: all 0.4s;
            position: relative;
            overflow: hidden;
        }

        .service-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: var(--gradient);
            transform: scaleX(0);
            transition: transform 0.4s;
        }

        .service-card:hover {
            transform: translateY(-8px);
            border-color: rgba(0, 217, 255, 0.3);
            background: rgba(255, 255, 255, 0.05);
        }

        .service-card:hover::before {
            transform: scaleX(1);
        }

        .service-icon {
            width: 55px;
            height: 55px;
            background: var(--gradient);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            color: #000;
            margin-bottom: 20px;
        }

        .service-card h3 {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .service-card p {
            color: var(--gray);
            font-size: 14px;
            margin-bottom: 15px;
        }

        .service-card ul li {
            padding: 5px 0;
            color: var(--gray);
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .service-card ul li::before {
            content: '\f00c';
            font-family: 'Font Awesome 6 Free';
            font-weight: 900;
            color: var(--primary);
            font-size: 11px;
        }

        /* ============================================
           ABOUT SECTION
           ============================================ */
        
        .about {
            padding: 100px 20px;
        }

        .about-container {
            max-width: 1100px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px;
            align-items: center;
        }

        .about-content h2 {
            font-size: 38px;
            font-weight: 700;
            margin-bottom: 20px;
            line-height: 1.2;
        }

        .about-content h2 span {
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .about-content p {
            color: var(--gray);
            font-size: 15px;
            margin-bottom: 25px;
        }

        .about-features {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        .about-feature {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .about-feature i {
            width: 38px;
            height: 38px;
            background: rgba(0, 217, 255, 0.1);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary);
            font-size: 16px;
        }

        .about-feature span {
            font-size: 14px;
            font-weight: 500;
        }

        .about-image-box {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 80px;
            position: relative;
        }

        .about-image-box::before {
            content: '';
            position: absolute;
            top: 20px;
            left: 20px;
            width: 100%;
            height: 100%;
            border: 2px solid var(--primary);
            border-radius: 20px;
            opacity: 0.3;
        }

        /* ============================================
           WHY CHOOSE US
           ============================================ */
        
        .why-us {
            padding: 100px 20px;
            background: rgba(255, 255, 255, 0.02);
        }

        .why-us-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 25px;
            max-width: 1100px;
            margin: 0 auto;
        }

        .why-us-card {
            text-align: center;
            padding: 35px 25px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            transition: all 0.3s;
        }

        .why-us-card:hover {
            transform: translateY(-5px);
            border-color: var(--secondary);
        }

        .why-us-card i {
            font-size: 36px;
            margin-bottom: 18px;
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .why-us-card h3 {
            font-size: 18px;
            margin-bottom: 10px;
        }

        .why-us-card p {
            color: var(--gray);
            font-size: 13px;
        }

        /* ============================================
           MISSION VISION
           ============================================ */
        
        .mission-vision {
            padding: 100px 20px;
        }

        .mv-container {
            max-width: 1000px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 35px;
        }

        .mv-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            transition: all 0.3s;
        }

        .mv-card:hover {
            border-color: var(--primary);
            transform: translateY(-5px);
        }

        .mv-card h3 {
            font-size: 26px;
            margin-bottom: 18px;
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .mv-card p {
            color: var(--gray);
            font-size: 14px;
            line-height: 1.8;
        }

        /* ============================================
           CONTACT SECTION
           ============================================ */
        
        .contact {
            padding: 100px 20px;
            text-align: center;
        }

        .contact-container {
            max-width: 800px;
            margin: 0 auto;
        }

        .contact h2 {
            font-size: 40px;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .contact p {
            color: var(--gray);
            margin-bottom: 40px;
        }

        .contact-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 25px;
        }

            background: rgba(
